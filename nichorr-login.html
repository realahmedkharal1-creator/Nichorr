<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nichorr — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12161C; --paper:#F3F5F4; --card:#FFFFFF;
    --citation:#2C4A73; --citation-bg:#E9EEF4;
    --verified:#1E7A5F; --muted:#5C6167; --muted-2:#8A8F96; --line:#DADDD8;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background:var(--paper); font-family:'IBM Plex Sans',sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; display:flex; align-items:center; justify-content:center; padding:20px;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .authcard{background:#fff; border:1px solid var(--line); border-radius:20px; padding:40px 36px; width:100%; max-width:400px; box-shadow:0 4px 24px rgba(18,22,28,.06);}
  .logo{font-family:'Fraunces',serif; font-weight:700; font-size:22px; text-align:center; margin-bottom:4px;}
  .logo span{color:var(--citation);}
  .tagline{text-align:center; font-size:12.5px; color:var(--muted-2); margin-bottom:28px;}

  .tabs{display:flex; background:var(--paper); border-radius:10px; padding:4px; margin-bottom:26px;}
  .tabs a{flex:1; text-align:center; padding:9px; font-size:13px; font-weight:600; border-radius:8px; text-decoration:none; color:var(--muted);}
  .tabs a.active{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(18,22,28,.08);}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; margin-bottom:7px;}
  .field input{width:100%; font-family:'IBM Plex Sans',sans-serif; font-size:14px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--paper);}
  .field input:focus{outline:none; border-color:var(--citation); box-shadow:0 0 0 3px var(--citation-bg);}

  .btn-submit{width:100%; background:var(--ink); color:#fff; font-weight:600; font-size:14.5px; padding:13px; border-radius:10px; border:none; cursor:pointer; margin-top:6px;}
  .forgot{text-align:right; margin:-8px 0 16px;}
  .forgot a{font-size:12px; color:var(--citation); text-decoration:none;}

  .foot-tag{display:flex; align-items:center; gap:8px; justify-content:center; margin-top:26px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted-2); letter-spacing:.4px;}
  .foot-tag .dot{width:5px; height:5px; border-radius:50%; background:var(--verified);}
</style>
</head>
<body>

<div class="authcard">
  <div class="logo">Nichorr<span>.</span></div>
  <div class="tagline">Evidence-first research for tech YouTubers</div>

  <div class="tabs">
    <a href="#" class="active">Sign In</a>
    <a href="#">Sign Up</a>
  </div>

  <div class="field">
    <label>Email</label>
    <input type="email" placeholder="you@example.com">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" placeholder="••••••••••">
  </div>
  <div class="forgot"><a href="#">Forgot password?</a></div>

  <button class="btn-submit">Sign In</button>

  <div class="foot-tag"><span class="dot"></span>TRACED CLAIMS ONLY · ZERO FABRICATED CITATIONS</div>
</div>

</body>
</html>
